<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKIHARA MIN RADIO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    color:white;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 20% 20%, #ff00cc33, transparent 30%),
        radial-gradient(circle at 80% 30%, #00ffff33, transparent 30%),
        radial-gradient(circle at 50% 90%, #7a00ff33, transparent 35%),
        #050510;

    position:relative;
}

/* BACKGROUND ANIMATION */

body::before,
body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(100px);
    z-index:-1;
    animation:float 10s infinite alternate ease-in-out;
}

body::before{
    background:#ff00cc;
    top:-200px;
    left:-200px;
}

body::after{
    background:#00ffff;
    bottom:-200px;
    right:-200px;
    animation-delay:3s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(100px,80px) scale(1.3);
    }
}

/* MAIN */

.container{
    width:95%;
    max-width:1100px;
    margin:auto;
    padding:30px 0;
}

/* HEADER */

header{
    text-align:center;
    margin-bottom:25px;
}

header h1{
    font-size:35px;
    letter-spacing:5px;

    background:linear-gradient(
        90deg,
        #00ffff,
        #ff00cc,
        #8a2be2,
        #00ffff
    );

    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;

    animation:gradient 5s linear infinite;
}

header p{
    color:#aaa;
    margin-top:8px;
}

@keyframes gradient{
    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }
}

/* PLAYER */

.player{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;

    padding:30px;

    border-radius:30px;

    background:rgba(255,255,255,.07);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 50px rgba(0,255,255,.08),
        inset 0 0 30px rgba(255,255,255,.03);
}

/* ALBUM */

.album-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.disk{
    width:280px;
    height:280px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #111 0 10%,
            #222 11% 15%,
            #111 16% 20%,
            #333 21% 25%,
            #111 26% 40%,
            #222 41% 55%,
            #111 56% 70%,
            #333 71% 100%
        );

    border:8px solid #111;

    box-shadow:
        0 0 30px #00ffff55,
        0 0 70px #ff00cc33;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* DISC LABEL */

.disk::before{
    content:"";
    width:100px;
    height:100px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #ff00cc,
            #8a2be2
        );

    box-shadow:
        0 0 30px #ff00cc;

    position:absolute;
}

.disk::after{
    content:"";
    width:20px;
    height:20px;

    background:#050510;

    border-radius:50%;

    position:absolute;
    z-index:2;
}

/* ROTATE */

.disk.playing{
    animation:rotateDisk 4s linear infinite;
}

@keyframes rotateDisk{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* SONG INFO */

.song-info{
    text-align:center;
    margin-top:25px;
}

.song-info h2{
    font-size:24px;
}

.song-info p{
    color:#aaa;
    margin-top:7px;
}

/* EQUALIZER */

.equalizer{
    display:flex;
    gap:5px;
    height:40px;
    align-items:end;
    margin-top:20px;
}

.bar{
    width:6px;
    height:10px;
    background:linear-gradient(#00ffff,#ff00cc);
    border-radius:10px;
}

.playing + .equalizer .bar{
    animation:eq .7s infinite alternate;
}

.bar:nth-child(1){animation-delay:.1s}
.bar:nth-child(2){animation-delay:.3s}
.bar:nth-child(3){animation-delay:.5s}
.bar:nth-child(4){animation-delay:.2s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.1s}
.bar:nth-child(7){animation-delay:.3s}

@keyframes eq{
    from{
        height:8px;
    }

    to{
        height:38px;
    }
}

/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:25px;
}

button{
    border:none;
    cursor:pointer;

    color:white;

    background:rgba(255,255,255,.08);

    width:50px;
    height:50px;

    border-radius:50%;

    font-size:20px;

    transition:.3s;
}

button:hover{
    transform:scale(1.15);

    background:linear-gradient(
        135deg,
        #00ffff,
        #ff00cc
    );

    box-shadow:0 0 25px #00ffff88;
}

.play{
    width:70px;
    height:70px;

    font-size:28px;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #ff00cc
        );

    box-shadow:
        0 0 25px #00ffff55;
}

/* PROGRESS */

.progress-area{
    margin-top:30px;
}

.progress{
    width:100%;
    height:7px;

    background:#ffffff18;

    border-radius:10px;

    cursor:pointer;
}

.progress-bar{
    width:0%;
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #00ffff,
            #ff00cc
        );

    box-shadow:0 0 15px #00ffff;
}

.time{
    display:flex;
    justify-content:space-between;

    color:#aaa;

    font-size:12px;

    margin-top:7px;
}

/* VOLUME */

.volume{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
}

.volume input{
    width:100%;
    accent-color:#00ffff;
}

/* PLAYLIST */

.playlist{
    margin-top:30px;
}

.playlist h2{
    margin-bottom:15px;
}

.song{
    display:flex;
    align-items:center;
    gap:15px;

    padding:15px;

    margin-bottom:10px;

    border-radius:15px;

    background:rgba(255,255,255,.05);

    border:1px solid transparent;

    cursor:pointer;

    transition:.3s;
}

.song:hover{
    background:rgba(255,255,255,.1);
    transform:translateX(5px);
}

.song.active{
    border-color:#00ffff;

    background:
        linear-gradient(
            90deg,
            #00ffff15,
            #ff00cc15
        );

    box-shadow:
        0 0 20px #00ffff22;
}

.song-number{
    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#ffffff12;

    color:#00ffff;
}

.song-name{
    flex:1;
}

.song-name strong{
    display:block;
}

.song-name small{
    color:#888;
}

.delete{
    width:35px;
    height:35px;

    font-size:14px;
}

/* FILE BUTTON */

.file-area{
    margin-top:20px;
}

.file-label{
    display:block;

    text-align:center;

    padding:15px;

    border-radius:15px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #00ffff22,
            #ff00cc22
        );

    border:1px dashed #00ffff88;

    transition:.3s;
}

.file-label:hover{
    background:
        linear-gradient(
            135deg,
            #00ffff44,
            #ff00cc44
        );

    transform:translateY(-3px);
}

#fileInput{
    display:none;
}

/* FOOTER */

footer{
    text-align:center;

    color:#666;

    margin-top:25px;

    font-size:13px;
}

/* MOBILE */

@media(max-width:800px){

    .player{
        grid-template-columns:1fr;
        padding:20px;
    }

    .disk{
        width:220px;
        height:220px;
    }

    header h1{
        font-size:25px;
    }

}

</style>
</head>

<body>

<div class="container">

<header>

<h1>🎧 AKIHARA MINI RADIO</h1>

<p>Feel the music • Feel the vibe • Feel the night</p>

</header>


<div class="player">

<!-- ALBUM AREA -->

<div class="album-area">

<div class="disk" id="disk"></div>

<div class="song-info">

<h2 id="title">
Belum Ada Lagu
</h2>

<p id="artist">
Pilih musik untuk mulai
</p>

</div>

<div class="equalizer" id="equalizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

</div>


<!-- PLAYER AREA -->

<div>

<div class="controls">

<button onclick="previousSong()">
⏮
</button>

<button
class="play"
id="playButton"
onclick="togglePlay()">

▶

</button>

<button onclick="nextSong()">
⏭
</button>

</div>


<div class="progress-area">

<div
class="progress"
id="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>

<div class="time">

<span id="currentTime">
0:00
</span>

<span id="duration">
0:00
</span>

</div>

</div>


<div class="volume">

<span>🔊</span>

<input
type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="0.8">

</div>


<div class="file-area">

<label
for="fileInput"
class="file-label">

📂 Tambahkan Musik dari Komputer

</label>

<input
type="file"
id="fileInput"
accept="audio/*"
multiple>

</div>

</div>

</div>


<!-- PLAYLIST -->

<div class="playlist">

<h2>🎵 Playlist</h2>

<div id="playlistContainer">

<p style="color:#777;">
Belum ada lagu. Tambahkan file musik di atas.
</p>

</div>

</div>


<footer>

AKIHARA MINI RADIO • HTML CSS JAVASCRIPT

</footer>

</div>


<audio id="audio"></audio>


<script>

const audio =
document.getElementById("audio");

const title =
document.getElementById("title");

const artist =
document.getElementById("artist");

const playButton =
document.getElementById("playButton");

const disk =
document.getElementById("disk");

const progress =
document.getElementById("progress");

const progressBar =
document.getElementById("progressBar");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const volume =
document.getElementById("volume");

const fileInput =
document.getElementById("fileInput");

const playlistContainer =
document.getElementById("playlistContainer");


let songs = [];

let currentIndex = 0;


/* FORMAT TIME */

function formatTime(seconds){

    if(isNaN(seconds)){
        return "0:00";
    }

    let min =
    Math.floor(seconds / 60);

    let sec =
    Math.floor(seconds % 60);

    if(sec < 10){
        sec = "0" + sec;
    }

    return min + ":" + sec;
}


/* ADD FILE */

fileInput.addEventListener(
"change",
function(){

    const files =
    Array.from(this.files);

    files.forEach(file => {

        const url =
        URL.createObjectURL(file);

        songs.push({

            name:file.name
                .replace(/\.[^/.]+$/, ""),

            artist:"Local Music",

            url:url

        });

    });


    if(songs.length > 0){

        if(
            !audio.src ||
            audio.src === window.location.href
        ){

            loadSong(0);

        }

    }

    renderPlaylist();

    this.value = "";

});


/* LOAD SONG */

function loadSong(index){

    if(songs.length === 0){
        return;
    }

    currentIndex = index;

    const song =
    songs[currentIndex];

    audio.src =
    song.url;

    title.textContent =
    song.name;

    artist.textContent =
    song.artist;

    progressBar.style.width =
    "0%";

    currentTime.textContent =
    "0:00";

    duration.textContent =
    "0:00";

    renderPlaylist();

}


/* PLAY */

function playSong(){

    if(songs.length === 0){

        alert(
        "Tambahkan musik terlebih dahulu."
        );

        return;

    }

    audio.play();

    playButton.textContent =
    "⏸";

    disk.classList.add(
    "playing"
    );

}


/* PAUSE */

function pauseSong(){

    audio.pause();

    playButton.textContent =
    "▶";

    disk.classList.remove(
    "playing"
    );

}


/* TOGGLE */

function togglePlay(){

    if(audio.paused){

        playSong();

    }else{

        pauseSong();

    }

}


/* NEXT */

function nextSong(){

    if(songs.length === 0){
        return;
    }

    currentIndex++;

    if(
        currentIndex >= songs.length
    ){

        currentIndex = 0;

    }

    loadSong(currentIndex);

    playSong();

}


/* PREVIOUS */

function previousSong(){

    if(songs.length === 0){
        return;
    }

    currentIndex--;

    if(currentIndex < 0){

        currentIndex =
        songs.length - 1;

    }

    loadSong(currentIndex);

    playSong();

}


/* UPDATE PROGRESS */

audio.addEventListener(
"timeupdate",
function(){

    if(audio.duration){

        const percent =
        (audio.currentTime /
        audio.duration) * 100;

        progressBar.style.width =
        percent + "%";

        currentTime.textContent =
        formatTime(
        audio.currentTime
        );

    }

});


/* LOAD DURATION */

audio.addEventListener(
"loadedmetadata",
function(){

    duration.textContent =
    formatTime(
    audio.duration
    );

});


/* CLICK PROGRESS */

progress.addEventListener(
"click",
function(e){

    if(!audio.duration){
        return;
    }

    const width =
    this.clientWidth;

    const clickX =
    e.offsetX;

    audio.currentTime =
    (clickX / width) *
    audio.duration;

});


/* VOLUME */

volume.addEventListener(
"input",
function(){

    audio.volume =
    this.value;

});


/* SONG END */

audio.addEventListener(
"ended",
function(){

    nextSong();

});


/* RENDER PLAYLIST */

function renderPlaylist(){

    playlistContainer.innerHTML = "";

    if(songs.length === 0){

        playlistContainer.innerHTML =
        `
        <p style="color:#777;">
        Belum ada lagu.
        </p>
        `;

        return;

    }


    songs.forEach(
    (song,index) => {

        const div =
        document.createElement("div");

        div.className =
        "song " +
        (index === currentIndex
        ? "active"
        : "");

        div.innerHTML = `

            <div class="song-number">
                ${index + 1}
            </div>

            <div class="song-name">

                <strong>
                    ${escapeHTML(song.name)}
                </strong>

                <small>
                    ${escapeHTML(song.artist)}
                </small>

            </div>

            <button
                class="delete"
                onclick="deleteSong(event,${index})">

                🗑

            </button>

        `;


        div.addEventListener(
        "click",
        function(e){

            if(
                e.target.closest(".delete")
            ){
                return;
            }

            loadSong(index);

            playSong();

        });


        playlistContainer.appendChild(div);

    });

}


/* DELETE SONG */

function deleteSong(
event,
index
){

    event.stopPropagation();

    URL.revokeObjectURL(
    songs[index].url
    );

    songs.splice(
    index,
    1
    );


    if(songs.length === 0){

        audio.pause();

        audio.src = "";

        title.textContent =
        "Belum Ada Lagu";

        artist.textContent =
        "Pilih musik untuk mulai";

        playButton.textContent =
        "▶";

        disk.classList.remove(
        "playing"
        );

        renderPlaylist();

        return;

    }


    if(index < currentIndex){

        currentIndex--;

    }


    if(
        currentIndex >= songs.length
    ){

        currentIndex =
        songs.length - 1;

    }


    loadSong(currentIndex);

}


/* SECURITY */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}


/* KEYBOARD CONTROL */

document.addEventListener(
"keydown",
function(e){

    if(
        e.code === "Space" &&
        e.target.tagName !== "INPUT"
    ){

        e.preventDefault();

        togglePlay();

    }


    if(e.code === "ArrowRight"){

        nextSong();

    }


    if(e.code === "ArrowLeft"){

        previousSong();

    }

});


/* INITIAL VOLUME */

audio.volume =
volume.value;

</script>

</body>
</html>
